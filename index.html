<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liv — Estado</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1f2937;--text:#e5e7eb;--dim:#6b7280;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--accent:#66CCFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:20px;max-width:800px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
h1{font-size:22px;font-weight:700}
h1 span{color:var(--accent)}
.badge{padding:4px 14px;border-radius:16px;font-size:13px;font-weight:600}
.badge.ok{background:#0d2818;color:var(--green);border:1px solid #1a3a2a}
.badge.warn{background:#3d2e0a;color:var(--yellow);border:1px solid #5a4510}
.badge.err{background:#3d1414;color:var(--red);border:1px solid #5a1a1a}
.grid{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.up{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.down{background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.warn{background:var(--yellow)}
.icon{width:24px;height:24px;border-radius:6px;flex-shrink:0}
.sname{font-weight:600;font-size:15px;flex:1}
.surl{color:var(--dim);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:#0d1420;border-radius:8px;padding:10px;text-align:center}
.stat-val{font-size:20px;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--dim);margin-top:2px}
.stat-val.green{color:var(--green)}
.card-foot{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--dim)}
footer{text-align:center;margin-top:40px;color:var(--dim);font-size:13px}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
.loading{text-align:center;padding:60px;color:var(--dim)}
</style>
</head>
<body>
<header><h1>📡 <span>Liv</span> — Estado del servidor</h1><div id="badge" class="badge ok">Cargando…</div></header>
<div id="grid" class="grid"><div class="loading">Cargando datos…</div></div>
<footer>Powered by <a href="https://github.com/zeissEngineer/upptime" target="_blank">Upptime</a> · <a href="https://chat.mystden.dev" target="_blank">chat.mystden.dev</a> · auto-refresh cada 5 min · <span id="last-check"></span></footer>
<script>
const DATA_URL="https://api.github.com/repos/zeissEngineer/upptime/contents/history/summary.json";
const REFRESH=5*60*1000;

function fmt_ms(ms){return ms>=1000?(ms/1000).toFixed(1)+"s":ms+"ms"}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

async function fetch_data(){
    const res=await fetch(DATA_URL+"?t="+Date.now());
    const raw=await res.json();
    const bytes=Uint8Array.from(atob(raw.content),c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
}

function render(data){
    const grid=document.getElementById("grid");
    if(!grid) return;
    grid.innerHTML="";
    let all_up=true;
    data.forEach(s=>{
        const is_up=s.status==="up";
        if(!is_up) all_up=false;
        const icon=s.icon?`<img src="${esc(s.icon)}" class="icon" alt="">`:"";
        const dot_cls=is_up?"up":"down";
        const badge=is_up?"✅ Operativo":"🔴 Caído";
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <div class="card-head">
                <div class="dot ${dot_cls}"></div>
                ${icon}
                <div class="sname">${esc(s.name)}</div>
                <div style="color:${is_up?"var(--green)":"var(--red)"};font-size:13px">${badge}</div>
            </div>
            <div class="surl">${esc(s.url)}</div>
            <div class="stats">
                <div class="stat"><div class="stat-val green">${s.uptimeDay}</div><div class="stat-lbl">Uptime 24h</div></div>
                <div class="stat"><div class="stat-val green">${s.uptimeWeek}</div><div class="stat-lbl">Uptime 7d</div></div>
                <div class="stat"><div class="stat-val">${s.uptimeMonth}</div><div class="stat-lbl">Uptime 30d</div></div>
                <div class="stat"><div class="stat-val">${s.time?fmt_ms(s.time):"—"}</div><div class="stat-lbl">Respuesta</div></div>
            </div>
            <div class="card-foot">
                <span>${esc(s.url.replace("https://",""))}</span>
                <span>Último check: ${s.lastUpdate?new Date(s.lastUpdate).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"—"}</span>
            </div>`;
        grid.appendChild(card);
    });
    const badge=document.getElementById("badge");
    if(badge){
        if(all_up){
            badge.className="badge ok";
            badge.textContent="🟢 Todos los sistemas operativos";
        }else{
            badge.className="badge err";
            badge.textContent="🔴 Algunos servicios con problemas";
        }
    }
    const lc=document.getElementById("last-check");
    if(lc) lc.textContent=new Date().toLocaleTimeString("es-ES");
}

async function refresh(){
    try{
        const data=await fetch_data();
        render(data);
    }catch(e){
        document.getElementById("grid").innerHTML='<div class="loading">❌ '+e.message+'<br><small>'+e.stack?.split("\n")[1]+'</small></div>';
    }
}

refresh();
setInterval(refresh,REFRESH);
</script>
</body>
</html>
